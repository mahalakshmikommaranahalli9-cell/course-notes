<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080808"
    >

    <meta
        name="description"
        content="BCS502 Computer Networks - VTU 5th Semester Course Notes by Mahalakshmi"
    >

    <title>BCS502 | Computer Networks | Course Notes</title>

    <style

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #1a160e 0%,
                    #0b0b0b 38%,
                    #050505 100%
                );
            color: #f4f1e8;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(
                    120deg,
                    transparent 0%,
                    rgba(255, 193, 7, 0.025) 50%,
                    transparent 100%
                );
            z-index: -2;
        }

        /* =========================================
           LION BACKGROUND
        ========================================= */

        .lion {
            position: fixed;
            font-size: 85px;
            opacity: 0.055;
            pointer-events: none;
            z-index: -1;
            animation: lionMove 18s ease-in-out infinite;
        }

        .lion.one {
            top: 14%;
            left: -20px;
        }

        .lion.two {
            bottom: 10%;
            right: -20px;
            animation-delay: 6s;
            animation-duration: 22s;
        }

        @keyframes lionMove {

            0% {
                transform: translate(0, 0) rotate(-4deg);
            }

            25% {
                transform: translate(35px, -25px) rotate(4deg);
            }

            50% {
                transform: translate(0, 20px) rotate(-2deg);
            }

            75% {
                transform: translate(-30px, -15px) rotate(5deg);
            }

            100% {
                transform: translate(0, 0) rotate(-4deg);
            }

        }

        /* =========================================
           HEADER
        ========================================= */

        header {
            width: 100%;
            padding: 22px 20px;
            border-bottom: 1px solid rgba(255, 193, 7, 0.16);
            background: rgba(5, 5, 5, 0.88);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .header-inner {
            width: min(1100px, 94%);
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            color: #ffc107;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .back {
            color: #ddd;
            text-decoration: none;
            border: 1px solid #333;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 13px;
            transition: 0.3s ease;
        }

        .back:hover {
            border-color: #ffc107;
            color: #ffc107;
            transform: translateY(-2px);
        }

        /* =========================================
           MAIN CONTAINER
        ========================================= */

        main {
            width: min(1100px, 94%);
            margin: auto;
            padding: 65px 0 80px;
        }

        /* =========================================
           HERO
        ========================================= */

        .hero {
            text-align: center;
            padding: 30px 10px 55px;
        }

        .course-code {
            display: inline-block;
            color: #ffc107;
            border: 1px solid rgba(255, 193, 7, 0.35);
            background: rgba(255, 193, 7, 0.06);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 22px;
        }

        h1 {
            font-size: clamp(38px, 7vw, 76px);
            line-height: 1;
            letter-spacing: -2px;
            margin-bottom: 18px;
        }

        .hero h1 span {
            color: #ffc107;
        }

        .subtitle {
            color: #aaa;
            font-size: 16px;
            line-height: 1.8;
            max-width: 700px;
            margin: auto;
        }

        .semester {
            margin-top: 18px;
            color: #ddd;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* =========================================
           INFO GRID
        ========================================= */

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 45px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid #242424;
            border-radius: 16px;
            padding: 22px;
            text-align: center;
        }

        .info-card small {
            display: block;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 10px;
            margin-bottom: 9px;
        }

        .info-card strong {
            color: #ffc107;
            font-size: 16px;
        }

        /* =========================================
           SECTION TITLE
        ========================================= */

        .section-heading {
            margin-bottom: 24px;
        }

        .section-heading small {
            color: #ffc107;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .section-heading h2 {
            margin-top: 8px;
            font-size: clamp(25px, 4vw, 36px);
        }

        /* =========================================
           MODULE GRID
        ========================================= */

        .modules {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .module-card {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.055),
                    rgba(255,255,255,0.018)
                );
            border: 1px solid #292929;
            border-radius: 20px;
            padding: 30px;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            transition:
                transform 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        .module-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(
                90deg,
                transparent,
                #ffc107,
                transparent
            );
            opacity: 0.7;
        }

        .module-card:hover {
            transform: translateY(-7px);
            border-color: rgba(255, 193, 7, 0.45);
            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.45);
        }

        .module-number {
            color: #ffc107;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 18px;
        }

        .module-card h3 {
            font-size: 27px;
            margin-bottom: 13px;
        }

        .module-card p {
            color: #a7a7a7;
            font-size: 14px;
            line-height: 1.75;
            flex: 1;
        }

        .topics {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin: 18px 0 22px;
        }

        .topic {
            color: #aaa;
            background: #111;
            border: 1px solid #292929;
            padding: 5px 9px;
            border-radius: 7px;
            font-size: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 13px 18px;
            border-radius: 10px;
            background: #ffc107;
            color: #090909;
            text-decoration: none;
            font-weight: 800;
            font-size: 13px;
            transition: 0.3s ease;
        }

        .btn:hover {
            background: #ffd54f;
            transform: translateY(-2px);
        }

        /* =========================================
           STUDY GUIDE
        ========================================= */

        .study-section {
            margin-top: 60px;
        }

        .study-box {
            border: 1px solid #282828;
            background: rgba(255,255,255,0.025);
            border-radius: 20px;
            padding: 30px;
        }

        .study-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            list-style: none;
        }

        .study-list li {
            position: relative;
            padding: 17px 18px 17px 45px;
            border-radius: 12px;
            background: #101010;
            border: 1px solid #222;
            color: #aaa;
            line-height: 1.6;
            font-size: 13px;
        }

        .study-list li::before {
            content: "✓";
            position: absolute;
            left: 17px;
            top: 15px;
            color: #ffc107;
            font-weight: 900;
            font-size: 16px;
        }

        /* =========================================
           GITHUB SECTION
        ========================================= */

        .github-section {
            margin-top: 60px;
        }

        .github-box {
            text-align: center;
            border: 1px solid rgba(255, 193, 7, 0.2);
            background:
                radial-gradient(
                    circle at center,
                    rgba(255,193,7,0.07),
                    rgba(255,255,255,0.015)
                );
            border-radius: 22px;
            padding: 42px 25px;
        }

        .github-box .github-icon {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .github-box h2 {
            font-size: 25px;
            margin-bottom: 10px;
        }

        .github-box p {
            color: #999;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .github-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 22px;
            border: 1px solid #ffc107;
            border-radius: 10px;
            color: #ffc107;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            transition: 0.3s ease;
        }

        .github-btn:hover {
            background: #ffc107;
            color: #080808;
            transform: translateY(-2px);
        }

        /* =========================================
           FOOTER
        ========================================= */

        footer {
            border-top: 1px solid #1d1d1d;
            padding: 25px 20px;
            text-align: center;
            color: #666;
            font-size: 12px;
        }

        footer strong {
            color: #ffc107;
        }

        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 800px) {

            .modules {
                grid-template-columns: 1fr;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .study-list {
                grid-template-columns: 1fr;
            }

            main {
                padding-top: 45px;
            }

        }

        @media (max-width: 520px) {

            header {
                padding: 17px 14px;
            }

            .header-inner {
                width: 100%;
            }

            .brand {
                font-size: 11px;
                letter-spacing: 1px;
            }

            .back {
                padding: 8px 11px;
                font-size: 11px;
            }

            main {
                width: 92%;
                padding-bottom: 55px;
            }

            .hero {
                padding: 20px 5px 40px;
            }

            h1 {
                font-size: 42px;
                letter-spacing: -1.5px;
            }

            .subtitle {
                font-size: 13px;
            }

            .module-card {
                padding: 23px;
                min-height: 260px;
            }

            .module-card h3 {
                font-size: 24px;
            }

            .study-box {
                padding: 20px;
            }

            .github-box {
                padding: 32px 18px;
            }

            .lion {
                font-size: 60px;
            }

        }

    </style>

</head>


<body>

    <!-- =========================================
         ANIMATED LION

    <div class="lion one">🦁</div>

    <!-- =========================================

    <!-- =========================================

    <main>


        <!-- HERO -->

        <section class="hero">

            <div class="course-code">
                BCS502
            </div>

            <h1>
                Computer <span>Networks</span>
            </h1>

            <p class="subtitle">
                Complete VTU 5th Semester course notes covering
                all five modules from Introduction to Application Layer.
            </p>

            <p class="semester">
                VTU • 5TH SEMESTER • CSE
            </p>

        </section>


        <!-- COURSE INFORMATION -->

        <section class="info-grid">

            <div class="info-card">

                <small>Course Code</small>

                <strong>
                    BCS502
                </strong>

            </div>


            <div class="info-card">

        </section>


        <!-- MODULES -->

        <section>

            <div class="section-heading">

                <small>
                    Course Content
                </small>

                <h2>
                    📚 Modules
                </h2>

            </div>


            <div class="modules">


                <!-- =================================
                     MODULE 01
                ================================== -->

                <article class="module-card">

                    <div class="module-number">
                        MODULE 01
                    </div>

                    <h3>
                        Introduction
                    </h3>

                    <p>
                        Data communications, networks, network types,
                        network models, TCP/IP protocol suite, OSI model,

                    </p>

                    <div class="topics">

                        <span class="topic">
                            Data Communications
                        </span>

                        <span class="topic">
                            TCP/IP
                        </span>

                        <span class="topic">
                            OSI
                        </span>

                        <span class="topic">

                        </span>

                        <span class="topic">

                        </span>

                    </div>

                    <a
                        href="module1.html"
                        class="btn"
                    >
                        Open Module 1 →
                    </a>

                </article>


                <!-- =================================
                     MODULE 02
                ================================== -->

                <article class="module-card">

                    <div class="module-number">
                        MODULE 02
                    </div>

                    <h3>
                        Data Link Layer
                    </h3>

                    <p>
                        Error detection and correction, block coding,
                        cyclic codes, data link control, framing,
                        flow control, error control, HDLC, MAC,
                        checksum and PPP.
                    </p>

                    <div class="topics">

                        <span class="topic">
                            Error Detection
                        </span>

                        <span class="topic">
                            Block Coding
                        </span>

                        <span class="topic">
                            HDLC
                        </span>

                        <span class="topic">
                            MAC
                        </span>

                        <span class="topic">
                            PPP
                        </span>

                    </div>

                    <a
                        href="module2.html"
                        class="btn"
                    >
                        Open Module 2 →
                    </a>

                </article>


                <!-- =================================
                     MODULE 03
                ================================== -->

                <article class="module-card">

                    <div class="module-number">
                        MODULE 03
                    </div>

                    <h3>
                        Network Layer
                    </h3>

                    <p>
                        Network layer services, packet switching,
                        IPv4 addressing, IPv4 datagram, IPv6 datagram,
                        routing algorithms, DVR, LSR, PVR,
                        RIP, OSPF, BGP and multicast routing.
                    </p>

                    <div class="topics">

                        <span class="topic">
                            IPv4
                        </span>

                        <span class="topic">
                            IPv6
                        </span>

                        <span class="topic">
                            DVR
                        </span>

                        <span class="topic">
                            OSPF
                        </span>

                        <span class="topic">
                            BGP
                        </span>

                    </div>

                    <a
                        href="module3.html"
                        class="btn"
                    >
                        Open Module 3 →
                    </a>

                </article>


                <!-- =================================
                     MODULE 04
                ================================== -->

                <article class="module-card">

                    <div class="module-number">
                        MODULE 04
                    </div>

                    <h3>
                        Transport Layer
                    </h3>

                    <p>
                        Transport layer services, UDP, TCP,
                        TCP segments, connections, flow control,
                        error control and congestion control.
                    </p>

                    <div class="topics">

                        <span class="topic">
                            UDP
                        </span>

                        <span class="topic">
                            TCP
                        </span>

                        <span class="topic">
                            Flow Control
                        </span>

                        <span class="topic">
                            Error Control
                        </span>

                        <span class="topic">
                            Congestion
                        </span>

                    </div>

                    <a
                        href="module4.html"
                        class="btn"
                    >
                        Open Module 4 →
                    </a>

                </article>


                <!-- =================================
                     MODULE 05
                ================================== -->

                <article class="module-card">

                    <div class="module-number">
                        MODULE 05
                    </div>

                    <h3>
                        Application Layer
                    </h3>

                    <p>
                        Application layer concepts, client-server
                        programming, HTTP, FTP, electronic mail,
                        DNS, TELNET and SSH.
                    </p>

                    <div class="topics">

                        <span class="topic">
                            HTTP
                        </span>

                        <span class="topic">
                            FTP
                        </span>

                        <span class="topic">
                            Email
                        </span>

                        <span class="topic">
                            DNS
                        </span>

                        <span class="topic">
                            SSH
                        </span>

                    </div>

                    <a
                        href="module5.html"
                        class="btn"
                    >
                        Open Module 5 →
                    </a>

                </article>


            </div>

        </section>


        <!-- =========================================
             STUDY GUIDE
        ========================================== -->

        <section class="study-section">

            <div class="section-heading">

                <small>
                    Preparation
                </small>

                <h2>
                    📖 Study Guide
                </h2>

            </div>


            <div class="study-box">

                <ul class="study-list">

                    <li>
                        Start with the basic concepts of each module
                        before moving to advanced topics.
                    </li>

                    <li>
                        Practice diagrams for OSI, TCP/IP,
                        protocols and networking layers.
                    </li>

                    <li>
                        Practice numerical problems related to
                        CRC, addressing and routing algorithms.
                    </li>

                    <li>
                        Prepare important 2-mark, 5-mark and
                        10-mark examination questions.
                    </li>

                    <li>
                        Compare related concepts such as TCP vs UDP,
                        IPv4 vs IPv6 and OSI vs TCP/IP.
                    </li>

                    <li>
                        Revise protocols and their functions before
                        the VTU examination.
                    </li>

                </ul>

            </div>

        </section>


        <!-- =========================================

        <section class="github-section">

            <div class="github-box">

                <div class="github-icon">
                    🐙

    <!-- =========================================
         ANTI-COPY SCRIPT
    ========================================== -->

    <script>

        document.addEventListener(
            "contextmenu",
            function(event) {
                event.preventDefault();
            }
        );


        document.addEventListener(
            "selectstart",
            function(event) {
                event.preventDefault();
            }
        );


        document.addEventListener(
            "dragstart",
            function(event) {
                event.preventDefault();
            }
        );


        document.addEventListener(
            "copy",
            function(event) {
                event.preventDefault();
            }
        );


        document.addEventListener(
            "cut",
            function(event) {
                event.preventDefault();
            }
        );


        document.addEventListener(
            "keydown",
            function(event) {

                const key =
                    event.key.toLowerCase();

                if (
                    (event.ctrlKey || event.metaKey) &&
                    [
                        "c",
                        "x",
                        "a",
                        "u",
                        "s",
                        "p"
                    ].includes(key)
                ) {

                    event.preventDefault();

                }


                if (
                    event.key === "PrintScreen"
                ) {

                    event.preventDefault();

                }

            }
        );

    </script>
